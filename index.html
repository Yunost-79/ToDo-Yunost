<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./styles.css" />
        <title>ToDo-Yunost</title>
    </head>
    <body>
        <div class="wrapper">
            <div class="container">
                <div class="todo_container">
                    <div class="todo_block">
                        <h1 class="todo_title">ToDo List</h1>
                        <div class="todo_block-input">
                            <input class="todo_input todo_input-item" type="text" placeholder="Enter your todo" />
                            <button class="todo_button todo_input-item" onclick="addTask()">Add</button>
                        </div>
                        <div class="todo_block-input input_warning"></div>
                        <ul class="todo_list"></ul>
                        <div class="todo_footer">
                            <div class="todo_counter"><span>todos:</span> <span class="count_item">0</span></div>
                            <button class="todos_cleaner" onclick="clearAllTodos()">Clear all todos</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="./scripts.js"></script>
    </body>
</html>
